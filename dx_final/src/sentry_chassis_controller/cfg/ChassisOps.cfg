#!/usr/bin/env python
PACKAGE = "sentry_chassis_controller"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# --- 1. 舵机 PID (位置环) ---
gen.add("lf_steer_p", double_t, 0, "LF Steer P", 10.0, 0.0, 1000.0)
gen.add("lf_steer_i", double_t, 0, "LF Steer I", 0.1,   0.0, 50.0)
gen.add("lf_steer_d", double_t, 0, "LF Steer D", 5.0,   0.0, 50.0)

gen.add("rf_steer_p", double_t, 0, "RF Steer P", 10.0, 0.0, 1000.0)
gen.add("rf_steer_i", double_t, 0, "RF Steer I", 0.1,   0.0, 50.0)
gen.add("rf_steer_d", double_t, 0, "RF Steer D", 5.0,   0.0, 50.0)

gen.add("lb_steer_p", double_t, 0, "LB Steer P", 10.0, 0.0, 1000.0)
gen.add("lb_steer_i", double_t, 0, "LB Steer I", 0.1,   0.0, 50.0)
gen.add("lb_steer_d", double_t, 0, "LB Steer D", 5.0,   0.0, 50.0)

gen.add("rb_steer_p", double_t, 0, "RB Steer P", 10.0, 0.0, 1000.0)
gen.add("rb_steer_i", double_t, 0, "RB Steer I", 0.1,   0.0, 50.0)
gen.add("rb_steer_d", double_t, 0, "RB Steer D", 5.0,   0.0, 50.0)

# --- 2. 轮速 PID (速度环) ---
gen.add("lf_wheel_p", double_t, 0, "LF Wheel P", 1.0, 0.0, 20.0)
gen.add("lf_wheel_i", double_t, 0, "LF Wheel I", 0.1, 0.0, 100.0)
gen.add("lf_wheel_d", double_t, 0, "LF Wheel D", 0.01,  0.0, 50.0)
gen.add("lf_wheel_max", double_t, 0, "LF Max Torque", 3.0, 0.0, 100.0)

gen.add("rf_wheel_p", double_t, 0, "RF Wheel P", 1.0, 0.0, 100.0)
gen.add("rf_wheel_i", double_t, 0, "RF Wheel I", 0.1, 0.0, 100.0)
gen.add("rf_wheel_d", double_t, 0, "RF Wheel D", 0.01,  0.0, 50.0)
gen.add("rf_wheel_max", double_t, 0, "RF Max Torque", 3.0, 0.0, 100.0)

gen.add("lb_wheel_p", double_t, 0, "LB Wheel P", 1.0, 0.0, 100.0)
gen.add("lb_wheel_i", double_t, 0, "LB Wheel I", 0.1, 0.0, 100.0)
gen.add("lb_wheel_d", double_t, 0, "LB Wheel D", 0.01,  0.0, 50.0)
gen.add("lb_wheel_max", double_t, 0, "LB Max Torque", 3.0, 0.0, 100.0)

gen.add("rb_wheel_p", double_t, 0, "RB Wheel P", 1.0, 0.0, 100.0)
gen.add("rb_wheel_i", double_t, 0, "RB Wheel I", 0.1, 0.0, 100.0)
gen.add("rb_wheel_d", double_t, 0, "RB Wheel D", 0.01,  0.0, 50.0)
gen.add("rb_wheel_max", double_t, 0, "RB Max Torque", 3.0, 0.0, 100.0)

# --- 3. 运动学参数 ---
gen.add("wheel_track", double_t, 0, "Wheel Track", 0.362, 0.1, 1.0)
gen.add("wheel_base",  double_t, 0, "Wheel Base", 0.362, 0.1, 1.0)
gen.add("offset_lf", double_t, 0, "Offset LF", 0.0, -3.14, 3.14)
gen.add("offset_rf", double_t, 0, "Offset RF", 0.0, -3.14, 3.14)
gen.add("offset_lb", double_t, 0, "Offset LB", 0.0, -3.14, 3.14)
gen.add("offset_rb", double_t, 0, "Offset RB", 0.0, -3.14, 3.14)

# --- 4. 模式与加速度 ---
gen.add("spin_vw", double_t, 0, "Spin Speed", 5.0, 0.0, 20.0)
gen.add("use_world_frame", bool_t, 0, "World Frame", False)

# [新增] 加速度限制 (数值越小加速越慢)
gen.add("acc_linear", double_t, 0, "Linear Acc (m/s^2)", 20.0, 0.1, 20.0)
gen.add("acc_angular", double_t, 0, "Angular Acc (rad/s^2)", 20.0, 0.1, 20.0)

exit(gen.generate(PACKAGE, "sentry_chassis_controller", "ChassisOps"))


