sentry_chassis_controller:
  sentry_chassis_plugin:

    # 舵向电机 (Pivot)
    lf_steer_p: 8.0
    lf_steer_i: 0.1
    lf_steer_d: 0.1
    
    rf_steer_p: 8.0
    rf_steer_i: 0.1
    rf_steer_d: 0.1
    
    lb_steer_p: 8.0
    lb_steer_i: 0.1
    lb_steer_d: 0.1
    
    rb_steer_p: 8.0
    rb_steer_i: 0.1
    rb_steer_d: 0.1
    
    # 驱动电机 (Wheel)
    lf_wheel_p: 1.0
    lf_wheel_i: 0.2
    lf_wheel_d: 0.0 
    lf_wheel_max: 1.5
    
    rf_wheel_p: 1.0
    rf_wheel_i: 0.2
    rf_wheel_d: 0.0
    rf_wheel_max: 1.5
    
    lb_wheel_p: 1.0
    lb_wheel_i: 0.2
    lb_wheel_d: 0.0
    lb_wheel_max: 1.5
    
    rb_wheel_p: 1.0
    rb_wheel_i: 0.2
    rb_wheel_d: 0.0
    rb_wheel_max: 1.5

    yaw_p: 0.5
    yaw_i: 0.1
    yaw_d: 0.0

    sync_kp: 5.0 # 交叉耦合增益
    kv_spin: 0.13

  
    # URDF几何与安装误差
    wheel_track: 0.362
    wheel_base: 0.362
    
    # 安装 Offset (URDF 中的 pivot_offset 值)，根据gazebo偏移量设0
    offset_lf: 0.0
    offset_rf: 0.0
    offset_lb: 0.0
    offset_rb: 0.0
    
    #小陀螺参数
    spin_vw: 10.0
    use_world_frame: false
    
    # 加速度限制
    acc_linear: 0.08   # m/s^2 
    acc_angular: 0.8  # rad/s^2 
    
    # 里程计校准系数
    odom_linear_scale: 1.000
    odom_angular_scale: 1.004

    # 功率控制参数
    power_constant_loss: 10.0 # 基础功耗 (W)
    power_max_input: 50.0     # 最大输入功率 (W)

    # 停车模式参数
    stop_mode_kp: 10.0        # P
    stop_mode_max_force: 3.0  # 最大刹车力矩 (Nm)

    