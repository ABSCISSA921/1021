robot_base_frame: base_footprint
transform_tolerance: 0.5
resolution: 0.05
# Includes the wheels; padding adds clearance to the physical 0.42 x 0.40 m base.
footprint: [[0.21, 0.20], [0.21, -0.20], [-0.21, -0.20], [-0.21, 0.20]]
footprint_padding: 0.02
obstacle_layer:
  enabled: true
  observation_sources: laser
  laser:
    topic: /scan
    data_type: LaserScan
    marking: true
    clearing: true
    obstacle_range: 6.0
    raytrace_range: 7.5
    max_obstacle_height: 1.0
    inf_is_valid: true
    observation_persistence: 0.0
inflation_layer:
  enabled: true
  inflation_radius: 0.50
  cost_scaling_factor: 4.0
