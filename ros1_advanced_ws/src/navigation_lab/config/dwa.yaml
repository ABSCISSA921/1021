DWAPlannerROS:
  max_vel_x: 0.35
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.35
  min_vel_trans: 0.03
  max_vel_theta: 0.9
  min_vel_theta: 0.15
  acc_lim_x: 0.5
  acc_lim_y: 0.0
  acc_lim_theta: 1.5
  acc_lim_trans: 0.5
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.15
  latch_xy_goal_tolerance: true
  trans_stopped_vel: 0.03
  theta_stopped_vel: 0.05
  sim_time: 2.0
  sim_granularity: 0.025
  angular_sim_granularity: 0.05
  vx_samples: 12
  vy_samples: 1
  vth_samples: 30
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.08
  forward_point_distance: 0.20
  stop_time_buffer: 0.2
  oscillation_reset_dist: 0.05
  scaling_speed: 0.25
  max_scaling_factor: 0.2
  publish_traj_pc: true
  publish_cost_grid_pc: false
