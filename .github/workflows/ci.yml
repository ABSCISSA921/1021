name: ROS 1 Learning

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ros1_learning_ws/**'
      - 'ros1_advanced_ws/**'
      - 'docs/**'
      - 'README.md'
      - 'scripts/**'
      - '.gitmodules'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'ros1_learning_ws/**'
      - 'ros1_advanced_ws/**'
      - 'docs/**'
      - 'README.md'
      - 'scripts/**'
      - '.gitmodules'
      - '.github/workflows/ci.yml'

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_repo.py

  build:
    runs-on: ubuntu-latest
    container: ros:noetic-ros-base-focal
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: basics
            workspace: ros1_learning_ws
            sources: ros1_learning_ws/src/ros_basics
            extra_apt: ""
          - target: simulation
            workspace: ros1_learning_ws
            sources: ros1_learning_ws/src
            extra_apt: "ros-noetic-image-transport"
          - target: advanced
            workspace: ros1_advanced_ws
            sources: ros1_advanced_ws/src
            extra_apt: "ros-noetic-moveit ros-noetic-turtlesim libopencv-dev"
    steps:
      # Container checkout needs git installed first.
      - name: Install git and build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git python3-pip python3-rosdep python3-osrf-pycommon
          pip3 install -U rosdep catkin-tools
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Initialize selected learning dependencies
        if: matrix.target != 'basics'
        run: git submodule update --init --recursive -- ${{ matrix.workspace }}/src
      - name: Install ROS dependencies
        run: |
          source /opt/ros/noetic/setup.bash
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            rosdep init
          fi
          rosdep update --include-eol-distros --rosdistro noetic
          rosdep install --from-paths ${{ matrix.sources }} --ignore-src --rosdistro noetic -y
          if [ -n "${{ matrix.extra_apt }}" ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y ${{ matrix.extra_apt }}
          fi
      - name: Build selected learning workspace
        run: bash scripts/build_learning.sh ${{ matrix.target }}
      - name: Test communication lessons
        if: matrix.target == 'basics'
        run: |
          source ros1_learning_ws/devel/setup.bash
          cd ros1_learning_ws
          catkin run_tests ros_basics --no-deps --no-status
          catkin_test_results build/ros_basics
